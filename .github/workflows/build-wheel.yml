name: Build Wheels

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  wheel:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            image: quay.io/pypa/manylinux_2_28_x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
            image: quay.io/pypa/manylinux_2_28_aarch64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Stable Torch ABI wheel
        run: |
          docker run --rm \
            -v "$PWD:/project" \
            -w /project \
            "${{ matrix.image }}" \
            bash -euxo pipefail -c '
              PYTHON=/opt/python/cp310-cp310/bin/python
              export PIP_ROOT_USER_ACTION=ignore
              "$PYTHON" -m pip install --upgrade pip build wheel "setuptools>=77.0.3,<82" setuptools_scm
              "$PYTHON" -m pip install \
                torch==2.11.0 \
                nvidia-cuda-runtime-cu12 \
                nvidia-cuda-nvrtc-cu12 \
                --index-url https://download.pytorch.org/whl/cu126 \
                --extra-index-url https://pypi.org/simple
              "$PYTHON" -m pip install .
              "$PYTHON" tools/build_native.py
              "$PYTHON" -m build --wheel --no-isolation
              "$PYTHON" -m wheel tags --remove \
                --python-tag cp310 \
                --abi-tag abi3 \
                --platform-tag manylinux_2_28_${{ matrix.arch }} \
                dist/*.whl
            '

      - name: Inspect wheel
        run: |
          python3 - <<'PY'
          import glob
          import zipfile

          wheels = glob.glob("dist/*.whl")
          assert len(wheels) == 1, wheels
          expected = {
              "humming/_native/${{ matrix.arch }}/libhumming_launcher.so",
              "humming/_native/${{ matrix.arch }}/libcubinpatch.so",
              "humming/_native/${{ matrix.arch }}/_device_info.abi3.so",
              "humming/_native/${{ matrix.arch }}/manifest.json",
              "humming/_native/${{ matrix.arch }}/nvrtc_compile",
          }
          with zipfile.ZipFile(wheels[0]) as wheel:
              native_files = {name for name in wheel.namelist() if "/_native/" in name}
          assert native_files == expected, native_files
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: humming-kernels-wheel-${{ matrix.arch }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 90

  wheel-windows:
    name: wheel-windows-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            arch: x64
            native_arch: x86_64
            msvc_arch: amd64
            wheel_platform: win_amd64
            pe_machine: "0x8664"
            torch_version: "2.11.0+cu130"
            torch_index_url: https://download.pytorch.org/whl/cu130
          - runner: windows-11-arm
            arch: arm64
            native_arch: aarch64
            msvc_arch: amd64_arm64
            wheel_platform: win_arm64
            pe_machine: "0xAA64"
            # CUDA-enabled Windows ARM64 PyTorch is currently distributed by NVIDIA.
            torch_version: "2.15.0.dev20260820+cu134"
            torch_index_url: https://pypi.nvidia.com/nvtorch_oot_nightly
    runs-on: ${{ matrix.runner }}
    env:
      HUMMING_DISABLE_PARALLEL_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: ${{ matrix.arch }}
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Install Windows build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip build wheel "setuptools>=77.0.3,<82" setuptools_scm pytest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install "torch==${{ matrix.torch_version }}" `
            --extra-index-url ${{ matrix.torch_index_url }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install . `
            "nvidia-cuda-runtime==13.4.92" `
            "nvidia-cuda-nvrtc==13.4.92" `
            "nvidia-cuda-cccl==13.3.4.3.1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Stable Torch ABI wheel
        shell: pwsh
        run: |
          python tools\build_native.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m build --wheel --no-isolation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheel = Get-ChildItem dist\*.whl
          if ($wheel.Count -ne 1) { throw "Expected exactly one wheel" }
          python -m wheel tags --remove --python-tag cp311 --abi-tag abi3 `
            --platform-tag ${{ matrix.wheel_platform }} $wheel.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Inspect Windows wheel
        shell: python
        run: |
          import glob
          import platform
          import struct
          import zipfile

          native_arch = {"amd64": "x86_64", "arm64": "aarch64"}[platform.machine().lower()]
          assert native_arch == "${{ matrix.native_arch }}", platform.machine()
          wheels = glob.glob("dist/*-cp311-abi3-${{ matrix.wheel_platform }}.whl")
          assert len(wheels) == 1, wheels
          native_dir = "humming/_native/${{ matrix.native_arch }}/"
          expected = {
              native_dir + name
              for name in (
                  "humming_launcher.dll", "cubinpatch.dll",
                  "_device_info.pyd", "nvrtc_compile.exe", "manifest.json",
              )
          }
          with zipfile.ZipFile(wheels[0]) as wheel:
              native_files = {name for name in wheel.namelist() if "/_native/" in name}
              assert native_files == expected, native_files
              metadata_name, = [name for name in wheel.namelist() if name.endswith(".dist-info/WHEEL")]
              metadata = wheel.read(metadata_name).decode()
              assert "Tag: cp311-abi3-${{ matrix.wheel_platform }}" in metadata, metadata
              for name in expected - {native_dir + "manifest.json"}:
                  binary = wheel.read(name)
                  assert binary[:2] == b"MZ", name
                  offset, = struct.unpack_from("<I", binary, 0x3C)
                  assert binary[offset:offset + 4] == b"PE\0\0", name
                  machine, = struct.unpack_from("<H", binary, offset + 4)
                  assert machine == int("${{ matrix.pe_machine }}", 16), (name, hex(machine))

      - name: Install and test wheel outside the source tree
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $wheel = Get-ChildItem "$env:GITHUB_WORKSPACE\dist\*.whl"
          python -m pip install --no-deps --force-reinstall $wheel.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest "$env:GITHUB_WORKSPACE\tests\test_jit_infrastructure.py" -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: humming-kernels-wheel-${{ matrix.wheel_platform }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 90

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip build
      - run: python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: humming-kernels-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 90
