[build-system]
requires = ["setuptools>=77.0.3", "wheel", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "humming-kernels"
dynamic = ["version"]
description = "JIT-compiled GPU GEMM kernels for quantized inference"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Humming contributors"}]
keywords = ["cuda", "gemm", "quantization", "inference"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.7",
    "triton",
    "numpy",
    "safetensors",
    "jinja2",
    "cuda-bindings",
    "tqdm",
    "tabulate"
]

[project.urls]
Homepage = "https://github.com/vllm-project/humming"
Source = "https://github.com/vllm-project/humming"
Issues = "https://github.com/vllm-project/humming/issues"
Documentation = "https://github.com/vllm-project/humming/tree/main/docs"
"Release notes" = "https://github.com/vllm-project/humming/releases"

[project.optional-dependencies]
cu12 = [
    "nvidia-cuda-runtime-cu12",
    "nvidia-cuda-cccl-cu12",
    "nvidia-cuda-nvcc-cu12",
    "nvidia-cuda-nvrtc-cu12",
]
cu13 = [
    "nvidia-cuda-runtime",
    "nvidia-cuda-cccl",
    "nvidia-cuda-nvcc",
    "nvidia-cuda-nvrtc",
]

[tool.setuptools_scm]
fallback_version = "0.0.0"
version_scheme = "post-release"
local_scheme = "node-and-date"
version_file = "humming/_version.py"

[tool.setuptools]
include-package-data = true
packages = {find = {include = ["humming", "humming.*"]}}

[tool.setuptools.package-data]
"*" = [
    "**/*.cu",
    "**/*.cuh",
    "**/*.cpp",
    "**/*.h",
    "**/*.hpp",
    "**/*.cc",
    "**/*.so",
    "**/*.pyi",
    "_native/*/nvrtc_compile",
    "_native/*/manifest.json",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
disable_error_code = ["no-untyped-call", "no-untyped-def", "type-arg", "untyped-decorator", "no-any-return"]
ignore_missing_imports = true
